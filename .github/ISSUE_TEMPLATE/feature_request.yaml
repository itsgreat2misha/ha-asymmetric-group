name: Feature request
description: Suggest an improvement for Asymmetric Group
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      placeholder: Describe the lighting behaviour you can't express with the current switches and sets.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example / your setup (optional)
      placeholder: Your lights, the sets you'd want, and what should happen — an example makes the request much easier to judge.
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround (if any)
    validations:
      required: false
