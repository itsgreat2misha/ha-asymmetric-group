name: Feature request
description: Suggest an improvement for Asymmetric Group
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      placeholder: Describe the lighting behaviour you can't express with the current switches and sets.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround (if any)
    validations:
      required: false
